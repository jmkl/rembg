[package]
name = "gpaste"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36"
eframe = "0.36"
egui-elegance = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
base64 = "0.22"
rfd = "0.15"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "avif"] }
