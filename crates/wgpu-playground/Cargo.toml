[package]
name = "wgpu-playground"
version = "0.1.0"
edition = "2024"
description = "A playground for experimenting with wgpu graphics"
[dependencies]
eframe = { version = "0.36", default-features = false, features = [
  "wgpu",
  "default_fonts",
  "x11",
  "wayland",
] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
] }
rfd = "0.15"