[package]
name = "compnode"
version = "0.1.0"
edition = "2024"
description = "CompNode — node-based image processing studio"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui-snarl = "0.12"
image = "0.25"
rfd = "0.15"
base64 = "0.22"
arboard = "3"
ureq = "3"
rembg-core = { path = "../rembg-core" }
gpaste = { path = "../gpaste" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crossbeam-channel = "0.5"