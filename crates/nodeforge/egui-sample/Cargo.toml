[package]
name = "nodeforge-egui-sample"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[dependencies]
nodeforge = { path = ".." }
eframe = { version = "0.31", default-features = false, features = [
  "glow",
  "default_fonts",
  "x11",
  "wayland",
] }

[profile.dev]
opt-level = 1

