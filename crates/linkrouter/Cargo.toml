[package]
name = "linkrouter"
version = "0.1.0"
edition = "2024"
description = "Route http/https links to the browser of your choice"
license = "WTFPL"

[dependencies]
eframe.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true


[[bin]]
name = "lr"
path = "src/main.rs"